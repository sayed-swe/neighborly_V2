name: MERN CI

# Runs the API tests and a production build of the web app on every push and
# pull request that touches the MERN app.
on:
  push:
    paths: ['mern/**', '.github/workflows/mern-ci.yml']
  pull_request:
    paths: ['mern/**', '.github/workflows/mern-ci.yml']

permissions:
  contents: read

concurrency:
  group: mern-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mern
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mern/package-lock.json

      - name: Cache MongoDB test binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('mern/package-lock.json') }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: API tests
        run: npm test

      - name: Web build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
